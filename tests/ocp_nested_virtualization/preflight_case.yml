---
# One pre-flight key case for test_selection.yml.
# Inputs: _case (dict of key vars), _expect_failure (bool)
- name: Pre-flight case - run
  block:
  - name: Pre-flight case - include
    ansible.builtin.include_role:
      name: "{{ _role }}"
      tasks_from: preflight_keys.yml
    vars:
      aws_nested_virt_access_key_id: "{{ _case.aws_nested_virt_access_key_id | default('') }}"
      aws_nested_virt_secret_access_key: "{{ _case.aws_nested_virt_secret_access_key | default('') }}"

  - name: Pre-flight case - no failure seen
    ansible.builtin.set_fact:
      _t_failed: false
      _t_msg: ""
  rescue:
  - name: Pre-flight case - failure seen
    ansible.builtin.set_fact:
      _t_failed: true
      _t_msg: "{{ ansible_failed_result.msg }}"

- name: Pre-flight case - assert
  ansible.builtin.assert:
    that:
    - _t_failed == _expect_failure
    - not _expect_failure or 'created before nested virtualization support' in _t_msg
