---
# OpenShift API authentication (required)
# openshift_api_url: https://api.cluster.example.com:6443
# openshift_cluster_admin_token: <token>
# openshift_validate_certs: false

# Number of worker nodes to scale to
# Workers are distributed round-robin across available availability zones
worker_instance_count: 0

# EC2 instance type for workers
# If empty or matches existing MachineSets, scales existing MachineSets
# If different, creates new MachineSets with this instance type
worker_instance_type: ""

# Custom suffix for new MachineSets when instance type differs
# Example: "gpu", "highmem", "compute"
# Results in names like: ocp-xjgsc-worker-us-east-2a-gpu
worker_machineset_suffix: "compute"

# Retry settings for waiting for nodes to report Ready status
worker_scale_retries: 90
worker_scale_delay: 10

# Enable EC2 nested virtualization on the worker instances after they are
# Ready (agnosticd.cloud_provider_aws.nested_virtualization). Needs a
# supported Intel worker_instance_type (for example m7i) and the
# aws_nested_virt_access_key_id/aws_nested_virt_secret_access_key credentials
# from the cluster's provision data.
openshift_aws_nested_virtualization_enable: false

# Worker-only mode: removes worker label from control-plane nodes
# and sets mastersSchedulable: false on the Scheduler object.
# Follows openshift_aws_nested_virtualization_enable so VMs only run on the
# workers with /dev/kvm; set explicitly to override.
worker_only: "{{ openshift_aws_nested_virtualization_enable | bool }}"

# Drain control-plane nodes to move existing workloads to dedicated workers
# Only applies when worker_only is true
worker_drain_control_plane: true
