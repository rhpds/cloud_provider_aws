---
- name: Fail if the nested virtualization credentials are missing
  when: >-
    aws_nested_virt_access_key_id | default('', true) | length == 0
    or aws_nested_virt_secret_access_key | default('', true) | length == 0
  ansible.builtin.fail:
    msg: >-
      aws_nested_virt_access_key_id/aws_nested_virt_secret_access_key are not set.
      The cluster was probably created before nested virtualization support;
      use a newer pool cluster.
